[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cronos-assistant"
version = "0.1.0"
description = "Backend do assistente Cronos"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1", "fish-audio-sdk==1.3.0", "python-dotenv==1.2.4"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["cronos*"]

[tool.setuptools.package-data]
cronos = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
