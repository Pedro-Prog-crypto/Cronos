[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cronos-assistant"
version = "0.5.0"
description = "Backend do assistente Cronos"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1", "fish-audio-sdk==1.3.0", "python-dotenv==1.2.4", "pillow==12.3.0", "google-genai==2.30.0", "yt-dlp[default]==2026.8.19", "pypdf==6.10.0", "pywebview==6.2.1; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
desktop = ["pywebview==6.2.1; sys_platform == 'win32'"]
search = ["ddgs==9.16.0"]
wake = ["vosk==0.3.45; sys_platform == 'win32'", "sounddevice==0.5.6; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
include = ["cronos*"]

[tool.setuptools.package-data]
cronos = ["studio/*.js", "studio/*.txt", "studio/media/*.jpg", "studio/threed/templates/*.html", "studio/threed/vendor/*", "studio/mistral_original/*", "eye-ui/**/*", "eye-ui/*", "eye-server/**/*", "eye-server/*", "revision.txt", "static/*", "ui/*", "ui/assets/*", "ui/licenses/*", "licenses/*", "ui/cesium/**/*", "ui/cesium/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
